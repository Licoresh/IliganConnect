<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iligan Connect staff mobile and tablet references</title>
  <style>
    :root{font-family:Inter,"Segoe UI",sans-serif;color:#102b47;background:#eaf0ef;font-synthesis:none;text-rendering:optimizeLegibility;--navy:#102d3b;--teal:#08756b;--mint:#e3f4f0;--line:#d7e4e3;--muted:#526b7d;--paper:#f8fbfa;--amber:#81530b;--amber-bg:#fff4dd;--blue:#22639b;--blue-bg:#eaf3fc}
    *{box-sizing:border-box}body{margin:0;font-size:14px;line-height:1.5}svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .app{min-height:100vh;display:grid;grid-template-columns:238px minmax(0,1fr)}.rail{background:var(--navy);color:#d6e6e5;padding:22px 14px;display:flex;flex-direction:column;gap:16px}.brand{display:flex;align-items:center;gap:9px;color:white;font-size:12px;font-weight:750;letter-spacing:1px}.mark{width:32px;height:32px;border-radius:10px;background:#08756b;display:grid;place-items:center}.mark svg{width:20px}.edition{font-size:11px;letter-spacing:1px;color:#a9c1c0}.nav-group{display:grid;gap:4px}.nav-group small{margin:12px 8px 4px;text-transform:uppercase;font-size:11px;letter-spacing:1px;color:#b6c9bf}.nav-link{display:flex;align-items:center;gap:11px;min-height:42px;padding:8px 10px;border-radius:9px;color:#d6e6e5;font-size:12px}.nav-link.active{background:#194a52;color:#fff;font-weight:700}.nav-link svg{flex:0 0 auto}.identity{margin-top:auto;padding-top:14px;border-top:1px solid #ffffff24;font-size:12px}.workspace{min-width:0}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}.place{font-size:12px;font-weight:700}.role{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:3px}.actions{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px}.main{max-width:1480px;margin:auto;padding:26px 30px 44px}.heading{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:16px}.heading h1{font-size:27px;letter-spacing:-.6px;margin:0 0 4px}.heading p{font-size:14px;color:var(--muted);margin:0;text-wrap:pretty}.action-button{background:var(--teal);color:#fff;padding:10px 14px;border:0;border-radius:9px;font-size:12px;font-weight:700;white-space:nowrap}.alert{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:12px;font-size:12px}.alert strong{color:var(--amber)}.statline{display:flex;gap:8px;margin-bottom:12px}.stat{flex:1;padding:12px 15px;border:1px solid var(--line);border-radius:10px;background:#fff}.stat b{font-size:19px}.stat span{display:block;color:var(--muted);font-size:12px;margin-top:3px}.columns{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(250px,.8fr);gap:12px;align-items:start}.section{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px;min-width:0}.section h2{font-size:16px;margin:0 0 4px}.sub{font-size:12px;color:var(--muted);margin:0 0 10px}.task{display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}.task:first-of-type{margin-top:8px}.task-icon{width:28px;height:28px;border-radius:8px;background:var(--amber-bg);color:var(--amber);display:grid;place-items:center}.task strong{display:block;font-size:12px;line-height:1.4}.task small{display:block;color:var(--muted);font-size:12px;margin-top:3px}.count{color:var(--teal);font-size:12px;font-weight:700}.chips{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}.chip{padding:4px 8px;border-radius:999px;background:var(--blue-bg);color:var(--blue);font-size:12px;font-weight:700}.chip.amber{background:var(--amber-bg);color:var(--amber)}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line);font-size:12px}.row span{color:var(--muted)}.map-preview{height:140px;margin-top:10px;border-radius:9px;background:linear-gradient(135deg,#d7e9e7,#b7d5cc 50%,#e5eee8);position:relative;overflow:hidden}.map-preview:before,.map-preview:after{content:"";position:absolute;background:#fff;opacity:.85;transform:rotate(-17deg);width:140%;height:2px;left:-20%;top:46%}.map-preview:after{transform:rotate(22deg);top:64%}.pin{position:absolute;width:17px;height:17px;background:var(--teal);border:3px solid white;border-radius:50%;left:48%;top:42%;box-shadow:0 1px 4px #173b3533}.foot{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12px;margin-top:16px}.phone-nav{display:none}
    @media(max-width:1023px){.app{grid-template-columns:112px minmax(0,1fr)}.rail{padding:16px 8px;gap:10px}.brand{justify-content:center}.brand .word,.edition,.nav-group small,.identity .name,.identity .role-text{display:none}.nav-group{gap:5px}.nav-link{display:grid;justify-items:center;align-content:center;gap:4px;min-height:58px;padding:5px 3px;text-align:center}.nav-link span{font-size:12px;line-height:1.2;overflow-wrap:anywhere}.nav-link svg{width:18px;height:18px}.top{height:60px;padding-inline:20px}.main{padding:22px 20px 32px}.columns{grid-template-columns:minmax(0,1.2fr) minmax(210px,.8fr)}}
    @media(max-width:767px){body{background:var(--paper)}.app{display:block;min-height:100dvh;padding-bottom:calc(72px + env(safe-area-inset-bottom))}.rail{display:none}.top{position:sticky;top:0;z-index:3;height:58px;padding:0 16px}.place,.role,.actions{font-size:12px}.actions{gap:9px}.actions .search{display:none}.main{padding:21px 16px 30px}.heading{align-items:flex-start;margin-bottom:14px}.heading h1{font-size:24px;line-height:1.18}.heading p{max-width:40ch;line-height:1.45}.heading .action-button{min-height:44px;padding-inline:12px}.alert{padding:11px 12px}.statline{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.stat{padding:10px}.stat b{font-size:17px}.columns{display:flex;flex-direction:column;gap:12px}.section{width:100%;padding:14px;border-radius:11px}.section.queue{order:-1}.map-preview{height:150px}.foot{display:none}.phone-nav{position:fixed;z-index:5;inset:auto 0 0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;padding:7px 8px max(8px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fff}.phone-nav button{display:grid;justify-items:center;align-content:center;gap:2px;min-width:0;min-height:50px;padding:3px 1px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:11px}.phone-nav button.active{background:var(--mint);color:var(--teal);font-weight:700}.phone-nav svg{width:18px;height:18px}}
  </style>
</head>
<body>
  <svg aria-hidden="true" width="0" height="0" style="position:absolute"><symbol id="home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></symbol><symbol id="report" viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></symbol><symbol id="map" viewBox="0 0 24 24"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3zM9 3v15M15 6v15"/></symbol><symbol id="people" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2zM17 5a3 3 0 0 1 0 6M19 14a5 5 0 0 1 2 4v2"/></symbol><symbol id="more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol><symbol id="calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></symbol></svg>
  <div class="app" id="app"></div>
  <script>
    const symbols={home:'home',reports:'report',map:'map',people:'people',more:'more',calendar:'calendar'};
    const navIcon={Overview:'home','Issue reports':'reports','Category reports':'reports',Residents:'people','Issue Mapping & Heatmap':'map','Geographic analytics':'map',Consultations:'people','Meeting requests':'calendar',Announcements:'report',Administration:'people',Settings:'more'};
    const roles={
      barangay:{title:'Tibanga dashboard',place:'Tibanga',role:'Barangay staff',group:'Local review',quick:['Home','Reports','Map','Residents','More'],items:['Overview','Issue reports','Residents','Issue Mapping & Heatmap','Geographic analytics','Consultations','Meeting requests','Announcements','Settings'],alert:'6 reports need barangay review',needs:6,active:8,due:2,tasks:[['Streetlight out along the pedestrian route','Received · Purok 3 · 18 Nov'],['Cracked pavement at the market approach','Under review · Zone 2'],['Blocked drainage scheduled for clearing','Scheduled · Purok 4']]},
      office:{title:'City Engineer dashboard',place:'City Engineer',role:'Office staff',group:'Assigned work',quick:['Home','Reports','Categories','Map','More'],items:['Overview','Issue reports','Category reports','Issue Mapping & Heatmap','Geographic analytics','Consultations','Meeting requests','Announcements','Settings'],alert:'4 assigned reports need action',needs:4,active:6,due:2,tasks:[['Eroded shoulder near the terminal approach','Roads · Tibanga · Assigned today'],['Damaged curb at the school crossing','Roads · Poblacion · Scheduled'],['Uneven pavement near the public market','Roads · Tibanga · In progress']]},
      admin:{title:'Iligan City dashboard',place:'Iligan City',role:'System administrator',group:'Citywide oversight',quick:['Home','Reports','Map','Admin','More'],items:['Overview','Issue reports','Issue Mapping & Heatmap','Geographic analytics','Consultations','Meeting requests','Announcements','Administration','Settings'],alert:'3 accounts are awaiting approval',needs:10,active:8,due:3,tasks:[['Approve barangay staff access','Pending · Barangay Tibanga'],['Review office responsibility changes','2 updates · Access rules'],['Check unresolved citywide reports','10 reports · All districts']]}
    };
    const role=new URLSearchParams(location.search).get('role')||'barangay',data=roles[role]||roles.barangay;
    const icon=(name)=>`<svg aria-hidden="true"><use href="#${symbols[name]||'report'}"/></svg>`;
    const quickIcon=['home','reports','map',role==='office'?'report':role==='admin'?'people':'people','more'];
    document.getElementById('app').innerHTML=`
      <aside class="rail"><div class="brand"><b class="mark">${icon('home')}</b><span class="word">ILIGAN CONNECT</span></div><div class="edition">LOCAL ACTION · STRONGER ILIGAN</div><nav class="nav-group" aria-label="Workspace sections"><small>${data.group}</small>${data.items.map((item,i)=>`<div class="nav-link ${i===0?'active':''}" title="${item}">${icon(navIcon[item])}<span>${({'Overview':'Home','Issue reports':'Reports','Category reports':'Categories','Issue Mapping & Heatmap':'Map','Geographic analytics':'Analytics','Consultations':'Consults','Meeting requests':'Meetings','Announcements':'Updates','Administration':'Admin','Settings':'Settings','Residents':'Residents'})[item]||item}</span></div>`).join('')}</nav><div class="identity">${data.place}<span class="role role-text">${data.role}</span></div></aside>
      <div class="workspace"><header class="top"><div class="place">${data.place}<small class="role">${data.role} · Iligan City</small></div><div class="actions"><span class="search">Find a report</span><span>Notifications</span>${icon('people')}</div></header><main class="main"><div class="heading"><div><h1>${data.title}</h1><p>Start with the work that needs attention in your authorized scope.</p></div><button class="action-button">Record a report</button></div><div class="alert"><strong>${data.alert}</strong><span>Updated just now</span></div><div class="statline"><div class="stat"><b>${data.needs}</b><span>Needs review</span></div><div class="stat"><b>${data.active}</b><span>Active work</span></div><div class="stat"><b>${data.due}</b><span>Due soon</span></div></div><div class="columns"><section class="section queue"><h2>${data.group}</h2><p class="sub">Open a record to see its status and the next permitted action.</p>${data.tasks.map((item,index)=>`<div class="task"><span class="task-icon">${icon('report')}</span><span><strong>${item[0]}</strong><small>${item[1]}</small></span><span class="count">Open →</span></div>`).join('')}<div class="row"><b>View all assigned records</b><span>→</span></div></section><section class="section"><h2>Area activity</h2><p class="sub">Reports visible to ${data.place}</p><div class="chips"><span class="chip amber">Needs review</span><span class="chip">In progress</span></div><div class="map-preview"><span class="pin"></span></div><div class="row"><b>${role==='office'?'Assigned coverage':'Authorized area'}</b><span>${role==='admin'?'Iligan City':data.place}</span></div></section><section class="section"><h2>Latest updates</h2><p class="sub">Recent status changes and coordination</p><div class="row"><b>Report status updated</b><span>12 min ago</span></div><div class="row"><b>Meeting follow-up recorded</b><span>Yesterday</span></div></section></div><div class="foot"><span>ILIGAN CONNECT · ${data.role}</span><span>Actions and records follow your approved permissions.</span></div></main></div>
      <nav class="phone-nav" aria-label="Primary navigation">${data.quick.map((item,index)=>`<button class="${index===0?'active':''}">${icon(quickIcon[index])}<span>${item}</span></button>`).join('')}</nav>`;
  </script>
</body>
</html>
