<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">City administration mobile layout reference</title>
  <desc id="desc">A 390 by 844 mobile layout with a compact header, scrollable administration tabs, and stacked account-management forms.</desc>
  <rect width="390" height="844" fill="#f3f8f7"/>
  <rect width="390" height="64" fill="#fff"/>
  <path d="M20 24h18M20 31h18M20 38h18" stroke="#087f76" stroke-width="2.4" stroke-linecap="round"/>
  <text x="52" y="29" fill="#153d47" font-family="Arial,sans-serif" font-size="13" font-weight="700">Citywide administration</text>
  <text x="52" y="46" fill="#687f88" font-family="Arial,sans-serif" font-size="10">System administrator · Iligan City</text>
  <circle cx="352" cy="32" r="17" fill="#e4f4f0"/><text x="352" y="36" text-anchor="middle" fill="#087f76" font-family="Arial,sans-serif" font-size="10" font-weight="700">CA</text>
  <path d="M0 63.5h390" stroke="#dce8e7"/>
  <text x="20" y="102" fill="#15344c" font-family="Arial,sans-serif" font-size="25" font-weight="700">Administration</text>
  <text x="20" y="123" fill="#687f88" font-family="Arial,sans-serif" font-size="12">Manage accounts, organizations, and access.</text>
  <rect x="16" y="143" width="358" height="53" rx="15" fill="#fff" stroke="#dce8e7"/>
  <rect x="22" y="150" width="128" height="39" rx="10" fill="#e3f4ef" stroke="#9ecfc5"/>
  <text x="86" y="174" text-anchor="middle" fill="#087f76" font-family="Arial,sans-serif" font-size="11" font-weight="700">Stakeholder accounts</text>
  <text x="222" y="174" text-anchor="middle" fill="#58727b" font-family="Arial,sans-serif" font-size="11" font-weight="600">Organizations</text>
  <text x="332" y="174" text-anchor="middle" fill="#58727b" font-family="Arial,sans-serif" font-size="11" font-weight="600">Routing</text>
  <text x="20" y="231" fill="#19384d" font-family="Arial,sans-serif" font-size="18" font-weight="700">Stakeholder accounts</text>
  <text x="20" y="251" fill="#6d838b" font-family="Arial,sans-serif" font-size="11">Invite staff and manage their access.</text>
  <rect x="16" y="271" width="358" height="435" rx="16" fill="#fff" stroke="#dce8e7"/>
  <text x="32" y="303" fill="#17384a" font-family="Arial,sans-serif" font-size="15" font-weight="700">Create a staff account</text>
  <text x="32" y="327" fill="#496675" font-family="Arial,sans-serif" font-size="11" font-weight="600">Staff member name</text>
  <rect x="32" y="337" width="326" height="43" rx="9" fill="#fbfdfc" stroke="#d9e6e4"/>
  <text x="32" y="408" fill="#496675" font-family="Arial,sans-serif" font-size="11" font-weight="600">Email for invitation</text>
  <rect x="32" y="418" width="326" height="43" rx="9" fill="#fbfdfc" stroke="#d9e6e4"/>
  <text x="32" y="489" fill="#496675" font-family="Arial,sans-serif" font-size="11" font-weight="600">Stakeholder type</text>
  <rect x="32" y="499" width="326" height="43" rx="9" fill="#fbfdfc" stroke="#d9e6e4"/>
  <text x="46" y="526" fill="#355665" font-family="Arial,sans-serif" font-size="12">Barangay staff</text>
  <text x="32" y="570" fill="#496675" font-family="Arial,sans-serif" font-size="11" font-weight="600">Assigned barangay</text>
  <rect x="32" y="580" width="326" height="43" rx="9" fill="#fbfdfc" stroke="#d9e6e4"/>
  <text x="46" y="607" fill="#355665" font-family="Arial,sans-serif" font-size="12">Choose a barangay</text>
  <rect x="32" y="639" width="326" height="48" rx="11" fill="#087f76"/>
  <text x="195" y="669" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="12" font-weight="700">Create account and send invitation</text>
  <text x="20" y="724" fill="#19384d" font-family="Arial,sans-serif" font-size="15" font-weight="700">Manage existing accounts</text>
  <text x="20" y="745" fill="#6d838b" font-family="Arial,sans-serif" font-size="11">Search and select an account below.</text>
  <rect x="16" y="764" width="358" height="52" rx="13" fill="#fff" stroke="#dce8e7"/>
  <text x="32" y="796" fill="#71858d" font-family="Arial,sans-serif" font-size="12">Name or account identifier</text>
